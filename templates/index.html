<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find empty classrooms at Dawson College in real-time.">
    <title>Dawson Classroom Finder</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" id="flatpickr-theme" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-section">
                <div class="logo-icon">
                    <img src="/static/icon.png" alt="Classroom Finder" style="display: block; width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div>
                    <h1 id="app-title">Classroom Finder</h1>
                    <p class="subtitle">Dawson College &mdash; Winter 2026</p>
                </div>
            </div>
            <div class="theme-selector" id="theme-selector">
                <label for="theme-select" class="input-label">Theme</label>
                <select id="theme-select" class="filter-select" onchange="changeTheme(this.value)">
                    <option value="default">Default</option>
                    <option value="ocean">Ocean Depths</option>
                    <option value="forest">Forest Canopy</option>
                    <option value="sunset">Sunset Amber</option>
                    <option value="midnight">Midnight</option>
                </select>
            </div>
        </header>

        <!-- Controls -->
        <section class="controls-panel card" id="controls-panel">
            <div class="controls-row">
                <div class="control-group grow">
                    <label for="datetime-input" class="input-label">Check at time</label>
                    <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                        <input type="datetime-local" id="datetime-input" class="input-field" step="900" style="flex: 1; min-width: 200px;">
                        <div class="btn-row" style="margin: 0;">
                            <button class="btn btn-primary" id="btn-check" onclick="checkRooms()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                Find Rooms
                            </button>
                            <button class="btn btn-secondary" id="btn-now" onclick="checkNow()">
                                Right Now
                            </button>
                        </div>
                    </div>
                    <span class="input-hint">Leave empty to use current time</span>
                </div>
            </div>
        </section>

        <!-- Loading -->
        <div class="loader-wrapper" id="loader" style="display:none;">
            <div class="loader-spinner"></div>
            <p class="loader-text">Scanning classrooms&hellip;</p>
        </div>

        <!-- Error -->
        <div class="error-card" id="error-display" style="display:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p id="error-text"></p>
        </div>

        <!-- Results -->
        <section class="results-section" id="results" style="display:none;">
            <!-- Summary -->
            <div class="summary-bar card">
                <div class="summary-time">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span id="summary-datetime"></span>
                </div>
                <div class="summary-stats">
                    <div class="stat stat-empty">
                        <span class="stat-number" id="stat-empty-count">0</span>
                        <span class="stat-label">Available</span>
                    </div>
                    <div class="stat stat-occupied">
                        <span class="stat-number" id="stat-occupied-count">0</span>
                        <span class="stat-label">Occupied</span>
                    </div>
                    <div class="stat stat-total">
                        <span class="stat-number" id="stat-total-count">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar card" style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; align-items: center;" id="filter-floor-container">
                    <span class="filter-label" style="min-width: 50px;">Floors:</span>
                    <div id="filter-floor" class="filter-checkboxes"></div>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; align-items: center;" id="filter-wing-container">
                    <span class="filter-label" style="min-width: 50px;">Wings:</span>
                    <div id="filter-wing" class="filter-checkboxes"></div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <button class="tab active" id="tab-empty" onclick="switchTab('empty')">
                    <span class="tab-dot tab-dot-empty"></span>
                    Available
                    <span class="tab-badge" id="tab-empty-badge">0</span>
                </button>
                <button class="tab" id="tab-occupied" onclick="switchTab('occupied')">
                    <span class="tab-dot tab-dot-occupied"></span>
                    Occupied
                    <span class="tab-badge" id="tab-occupied-badge">0</span>
                </button>
            </div>

            <!-- Room Grids -->
            <div class="rooms-grid" id="empty-rooms-grid"></div>
            <div class="rooms-grid" id="occupied-rooms-grid" style="display:none;"></div>
        </section>

        <footer class="app-footer">
            <p>Data from <a href="https://timetable.dawsoncollege.qc.ca/" target="_blank" rel="noopener">timetable.dawsoncollege.qc.ca</a></p>
        </footer>
    </div>

    <script>
        let lastResult = null;

        /* ========================
           Theme System
           ======================== */
        const themes = {
            default: {}, // uses CSS defaults
            ocean: {
                '--bg-page': '#0d1b2a',
                '--bg-card': '#1b2838',
                '--bg-card-hover': '#223344',
                '--border': '#2a3f55',
                '--border-focus': '#0ea5e9',
                '--text-primary': '#e2e8f0',
                '--text-secondary': '#94a3b8',
                '--text-muted': '#64748b',
                '--accent': '#0ea5e9',
                '--accent-light': '#0c2d48',
                '--green-600': '#22d3ee',
                '--green-100': '#083344',
                '--green-50': '#0a2533',
                '--red-600': '#f472b6',
                '--red-100': '#3b1a3a',
                '--red-50': '#2a1229',
                '--shadow-sm': '0 1px 3px rgba(0,0,0,0.3)',
                '--shadow-md': '0 2px 8px rgba(0,0,0,0.35)',
            },
            forest: {
                '--bg-page': '#f0f5f0',
                '--bg-card': '#ffffff',
                '--bg-card-hover': '#f5faf5',
                '--border': '#c8dcc8',
                '--border-focus': '#2d8a4e',
                '--text-primary': '#1a2e1a',
                '--text-secondary': '#3d5a3d',
                '--text-muted': '#6b8a6b',
                '--accent': '#2d8a4e',
                '--accent-light': '#e6f4ea',
                '--green-600': '#1a7a36',
                '--green-100': '#bbf7d0',
                '--green-50': '#ecfdf5',
                '--red-600': '#c2410c',
                '--red-100': '#fed7aa',
                '--red-50': '#fff7ed',
                '--shadow-sm': '0 1px 2px rgba(0,40,0,0.06)',
                '--shadow-md': '0 2px 6px rgba(0,40,0,0.08)',
            },
            sunset: {
                '--bg-page': '#1a1118',
                '--bg-card': '#2a1f28',
                '--bg-card-hover': '#352a33',
                '--border': '#443540',
                '--border-focus': '#f59e0b',
                '--text-primary': '#fde8d0',
                '--text-secondary': '#c4a882',
                '--text-muted': '#8a7060',
                '--accent': '#f59e0b',
                '--accent-light': '#3d2e10',
                '--green-600': '#84cc16',
                '--green-100': '#1a2e0a',
                '--green-50': '#1a2410',
                '--red-600': '#f87171',
                '--red-100': '#450a0a',
                '--red-50': '#301010',
                '--shadow-sm': '0 1px 3px rgba(0,0,0,0.3)',
                '--shadow-md': '0 2px 8px rgba(0,0,0,0.4)',
            },
            midnight: {
                '--bg-page': '#0f0a1a',
                '--bg-card': '#1a1230',
                '--bg-card-hover': '#221a40',
                '--border': '#2d2250',
                '--border-focus': '#a78bfa',
                '--text-primary': '#e8e0f8',
                '--text-secondary': '#a8a0c0',
                '--text-muted': '#6b6088',
                '--accent': '#a78bfa',
                '--accent-light': '#1e1540',
                '--green-600': '#4ade80',
                '--green-100': '#0a2a1a',
                '--green-50': '#0a1f14',
                '--red-600': '#fb7185',
                '--red-100': '#3a0a1a',
                '--red-50': '#2a0a14',
                '--shadow-sm': '0 1px 3px rgba(0,0,0,0.4)',
                '--shadow-md': '0 2px 8px rgba(0,0,0,0.5)',
            },
        };

        // CSS default values for reset
        const defaultThemeValues = {
            '--bg-page': '#f4f5f7',
            '--bg-card': '#ffffff',
            '--bg-card-hover': '#fafafa',
            '--border': '#e2e5ea',
            '--border-focus': '#6366f1',
            '--text-primary': '#1a1d23',
            '--text-secondary': '#4b5563',
            '--text-muted': '#9ca3af',
            '--accent': '#4f46e5',
            '--accent-light': '#eef2ff',
            '--green-600': '#16a34a',
            '--green-100': '#dcfce7',
            '--green-50': '#f0fdf4',
            '--red-600': '#dc2626',
            '--red-100': '#fee2e2',
            '--red-50': '#fef2f2',
            '--shadow-sm': '0 1px 2px rgba(0,0,0,0.05)',
            '--shadow-md': '0 1px 6px rgba(0,0,0,0.07)',
        };

        function changeTheme(themeName) {
            const root = document.documentElement;
            const isDark = ['ocean', 'sunset', 'midnight'].includes(themeName);

            // Reset to defaults first
            Object.entries(defaultThemeValues).forEach(([prop, value]) => {
                root.style.setProperty(prop, value);
            });

            // Apply theme overrides
            const themeVars = themes[themeName];
            if (themeVars) {
                Object.entries(themeVars).forEach(([prop, value]) => {
                    root.style.setProperty(prop, value);
                });
            }

            // Handle dark theme specific overrides for elements with hardcoded colors
            document.body.setAttribute('data-theme', themeName);

            // Update Flatpickr theme
            const fpThemeLink = document.getElementById('flatpickr-theme');
            if (fpThemeLink) {
                if (isDark) {
                    fpThemeLink.href = "https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css";
                } else {
                    fpThemeLink.href = "https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css";
                }
            }

            // Save preference
            localStorage.setItem('cf-theme', themeName);
        }

        // Restore saved theme
        function restoreTheme() {
            const saved = localStorage.getItem('cf-theme');
            if (saved && themes[saved] !== undefined) {
                document.getElementById('theme-select').value = saved;
                changeTheme(saved);
            }
        }

        // Parse floor and wing from a room name like "-1H.4" → floor: "-1", wing: "H"
        function parseRoom(name) {
            const m = name.match(/^(-?\d+)([A-Za-z]+)\./);
            if (!m) return { floor: null, wing: null };
            return { floor: m[1], wing: m[2].toUpperCase() };
        }

        function checkNow() {
            document.getElementById('datetime-input').value = '';
            checkRooms();
        }

        async function checkRooms() {
            const dtInput = document.getElementById('datetime-input').value;
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const errorDisplay = document.getElementById('error-display');
            const btn = document.getElementById('btn-check');

            errorDisplay.style.display = 'none';
            results.style.display = 'none';
            loader.style.display = 'flex';
            btn.disabled = true;

            try {
                const body = {};
                if (dtInput) body.datetime = dtInput;

                const resp = await fetch('/api/check-rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Unknown error');

                lastResult = data;
                buildFilters(data);
                renderResults(data);
            } catch (err) {
                document.getElementById('error-text').textContent = err.message;
                errorDisplay.style.display = 'flex';
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        function buildFilters(data) {
            const allRooms = [...data.empty.rooms, ...data.occupied.rooms];
            const floors = new Set();
            const wings = new Set();

            allRooms.forEach(r => {
                const { floor, wing } = parseRoom(r);
                if (floor !== null) floors.add(floor);
                if (wing !== null) wings.add(wing);
            });

            const sortedFloors = [...floors].sort((a, b) => parseInt(a) - parseInt(b));
            const sortedWings = [...wings].sort();

            const floorSel = document.getElementById('filter-floor');
            const wingSel = document.getElementById('filter-wing');

            const currentFloorChecked = Array.from(floorSel.querySelectorAll('input:checked')).map(el => el.value);
            const currentWingChecked = Array.from(wingSel.querySelectorAll('input:checked')).map(el => el.value);

            floorSel.innerHTML = sortedFloors.map(f => `
                <label class="filter-pill">
                    <input type="checkbox" value="${f}" onchange="applyFilters()" ${currentFloorChecked.includes(f) ? 'checked' : ''}>
                    <span>${f}</span>
                </label>
            `).join('');

            wingSel.innerHTML = sortedWings.map(w => `
                <label class="filter-pill">
                    <input type="checkbox" value="${w}" onchange="applyFilters()" ${currentWingChecked.includes(w) ? 'checked' : ''}>
                    <span>${w}</span>
                </label>
            `).join('');
        }

        function applyFilters() {
            if (!lastResult) return;
            renderResults(lastResult);
        }

        function filterRooms(rooms) {
            const floorSel = document.getElementById('filter-floor');
            const wingSel = document.getElementById('filter-wing');
            
            const selectedFloors = Array.from(floorSel.querySelectorAll('input:checked')).map(el => el.value);
            const selectedWings = Array.from(wingSel.querySelectorAll('input:checked')).map(el => el.value);

            return rooms.filter(r => {
                const parsed = parseRoom(r);
                if (selectedFloors.length > 0 && !selectedFloors.includes(parsed.floor)) return false;
                if (selectedWings.length > 0 && !selectedWings.includes(parsed.wing)) return false;
                return true;
            });
        }

        function renderResults(data) {
            const results = document.getElementById('results');
            const filteredEmpty = filterRooms(data.empty.rooms);
            const filteredOccupied = filterRooms(data.occupied.rooms);

            // Summary (unfiltered totals)
            document.getElementById('summary-datetime').textContent = data.check_time;
            document.getElementById('stat-empty-count').textContent = filteredEmpty.length;
            document.getElementById('stat-occupied-count').textContent = filteredOccupied.length;
            document.getElementById('stat-total-count').textContent = filteredEmpty.length + filteredOccupied.length;

            // Tab badges
            document.getElementById('tab-empty-badge').textContent = filteredEmpty.length;
            document.getElementById('tab-occupied-badge').textContent = filteredOccupied.length;

            // Empty rooms
            const emptyGrid = document.getElementById('empty-rooms-grid');
            if (filteredEmpty.length === 0) {
                emptyGrid.innerHTML = '<div class="no-rooms">No available rooms match your filters.</div>';
            } else {
                emptyGrid.innerHTML = filteredEmpty.map((room, i) => `
                    <div class="room-card room-empty" style="animation-delay: ${i * 0.01}s">
                        <div class="room-status-dot"></div>
                        <span class="room-name">${room}</span>
                    </div>
                `).join('');
            }

            // Occupied rooms
            const occGrid = document.getElementById('occupied-rooms-grid');
            if (filteredOccupied.length === 0) {
                occGrid.innerHTML = '<div class="no-rooms">No occupied rooms match your filters.</div>';
            } else {
                occGrid.innerHTML = filteredOccupied.map((room, i) => {
                    const details = data.occupied.details[room] || [];
                    const detailHtml = details.map(d =>
                        `<span class="room-detail">${d.start} – ${d.end}</span>`
                    ).join('');
                    return `
                        <div class="room-card room-occupied" style="animation-delay: ${i * 0.01}s">
                            <div class="room-status-dot"></div>
                            <span class="room-name">${room}</span>
                            <div class="room-details">${detailHtml}</div>
                        </div>
                    `;
                }).join('');
            }

            results.style.display = 'block';
            switchTab(document.getElementById('tab-empty').classList.contains('active') ? 'empty' : 'occupied');
        }

        function switchTab(tab) {
            const tabEmpty = document.getElementById('tab-empty');
            const tabOccupied = document.getElementById('tab-occupied');
            const gridEmpty = document.getElementById('empty-rooms-grid');
            const gridOccupied = document.getElementById('occupied-rooms-grid');

            if (tab === 'empty') {
                tabEmpty.classList.add('active');
                tabOccupied.classList.remove('active');
                gridEmpty.style.display = 'grid';
                gridOccupied.style.display = 'none';
            } else {
                tabOccupied.classList.add('active');
                tabEmpty.classList.remove('active');
                gridOccupied.style.display = 'grid';
                gridEmpty.style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            restoreTheme();
            
            flatpickr("#datetime-input", {
                enableTime: true,
                dateFormat: "Y-m-d\\TH:i",
                altInput: true,
                altFormat: "F j, Y h:i K",
                minuteIncrement: 15
            });

            checkRooms();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
